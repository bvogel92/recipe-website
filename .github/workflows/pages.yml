# Publishes the assets/ folder to GitHub Pages whenever main changes.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that config.js holds no secrets
        run: |
          if grep -Eiq 'client_?secret|GOCSPX-' assets/config.js; then
            echo "assets/config.js looks like it contains a client secret. Only the client ID belongs there." >&2
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: assets
      - id: deployment
        uses: actions/deploy-pages@v5
