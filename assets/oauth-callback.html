<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signing you in…</title>
<style>body{font:15px/1.5 Arial,sans-serif;color:#20201d;background:#f4f0e6;margin:0;padding:40px 20px}main{max-width:360px;margin:0 auto;background:#fffdf5;border:3px solid #20201d;box-shadow:6px 6px 0 #20201d;padding:22px 24px}strong{display:block;font-size:19px;margin-bottom:6px}p{margin:0}</style>
</head>
<body>
<main><strong>✳ Recipe Collection</strong><p id="msg" role="status">Signing you in&hellip; this window will close automatically.</p></main>
<script>
(function(){
  var query = new URLSearchParams(location.search);
  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  function get(k){ return query.get(k) || hash.get(k) || ''; }
  var state = get('state');
  var error = get('error');
  var code = query.get('code') || '';
  var token = hash.get('access_token') || '';
  var payload = { type: 'recipe-cloud-oauth', state: state };
  if (error) { payload.error = error; var d = get('error_description'); if (d) payload.errorDescription = d; }
  else if (code) { payload.code = code; payload.scope = get('scope'); }
  else if (token) { payload.accessToken = token; payload.expiresIn = Number(hash.get('expires_in')) || 3600; payload.scope = get('scope'); }
  else { payload.error = 'no_code'; }

  // Keep the code/token out of the address bar and browser history.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  var msg = document.getElementById('msg');
  var opener = null;
  try { opener = window.opener; } catch (e) {}
  // The app tags `state` with ".p" (pop-up) or ".r" (full-page redirect).
  var popup = /\.p$/.test(state) || (!/\.r$/.test(state) && !!opener);

  if (popup) {
    // Hand the result back to the app tab. Google's sign-in pages can cut the
    // link to window.opener, so also use same-origin channels that don't need it.
    try {
      // An access token is only ever posted to our own origin; an
      // authorization code is useless without the PKCE verifier, so it may
      // go to the app on another origin (e.g. localhost on the server).
      if (opener) opener.postMessage(payload, payload.accessToken ? location.origin : '*');
    } catch (e) {}
    try { var bc = new BroadcastChannel('rc-cloud-oauth'); bc.postMessage(payload); bc.close(); } catch (e) {}
    try { localStorage.setItem('rc-cloud-oauth-result', JSON.stringify(payload)); } catch (e) {}
    setTimeout(function(){
      try { window.close(); } catch (e) {}
      // Still open (some browsers refuse): tell the person what to do.
      setTimeout(function(){ msg.textContent = 'You’re signed in. You can close this window and go back to Recipe Collection.'; }, 300);
    }, 400);
  } else {
    // Full-page redirect flow (no pop-up support): stash the result for the
    // app and go back to the home page, which finishes the sign-in there.
    msg.textContent = 'Signing you in… taking you back to Recipe Collection.';
    try { sessionStorage.setItem('rc-cloud-oauth-result', JSON.stringify(payload)); } catch (e) {}
    setTimeout(function(){ location.replace('./?rc_oauth=1'); }, 300);
  }
})();
</script>
</body>
</html>
