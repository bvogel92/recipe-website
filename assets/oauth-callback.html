<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing you in…</title>
<style>body{font:14px/1.5 system-ui,sans-serif;color:#20201d;background:#f4f0e6;padding:40px}p{max-width:340px}</style>
</head>
<body>
<p id="msg">Signing you in&hellip; this window will close automatically.</p>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var code = params.get('code') || '';
  var state = params.get('state') || '';
  var error = params.get('error') || '';
  var description = params.get('error_description') || '';
  var payload = { type: 'recipe-cloud-oauth', state: state };
  if (error) { payload.error = error; if (description) payload.errorDescription = description; }
  else if (code) { payload.code = code; }
  else { payload.error = 'no_code'; }
  var sent = false;
  var opener = null;
  try { opener = window.opener; } catch (e) {}
  if (opener) {
    try { opener.postMessage(payload, '*'); sent = true; } catch (e) {}
  }
  if (sent) {
    // Pop-up flow: the main window is listening for this message; close us.
    setTimeout(function(){ try { window.close(); } catch (e) {} }, 600);
  } else {
    // Full-page redirect flow (no opener — pop-ups unavailable): stash the
    // result in sessionStorage for the app and return to the home page,
    // which finishes the sign-in from there.
    var el = document.getElementById('msg');
    el.textContent = 'Signing you in… taking you back to Recipe Collection.';
    try { sessionStorage.setItem('rc-cloud-oauth-result', JSON.stringify(payload)); } catch (e) {}
    setTimeout(function(){ location.replace('./?rc_oauth=1'); }, 600);
  }
})();
</script>
</body>
</html>
